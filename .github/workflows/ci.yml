name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report legacy lint findings (advisory)
        continue-on-error: true
        run: npm run lint
      - name: Regress configuration privacy and provider changes
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Build without provider credentials
        run: npm run build
      - name: Check standalone package boundary
        run: npm run check:bundle
