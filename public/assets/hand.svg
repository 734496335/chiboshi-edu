<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" aria-label="手掌">
  <ellipse cx="128" cy="232" rx="80" ry="7" fill="#4A3520" opacity="0.12"/>

  <g stroke="#4A3520" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#FFD9A0">
    <!-- 手掌（圆角矩形） -->
    <path d="M 70 130
             Q 70 110 90 110
             L 178 110
             Q 198 110 198 130
             L 198 200
             Q 198 224 174 224
             L 94 224
             Q 70 224 70 200 Z"/>

    <!-- 拇指（左下） -->
    <path d="M 70 158
             Q 50 156 44 174
             Q 40 196 60 200
             Q 70 200 78 192"/>

    <!-- 4 根手指（从左到右：食指、中指、无名指、小指） -->
    <!-- 食指（最长） -->
    <path d="M 86 110
             Q 86 50 102 50
             Q 118 50 118 110"/>
    <!-- 中指（更长） -->
    <path d="M 124 110
             Q 124 36 140 36
             Q 156 36 156 110"/>
    <!-- 无名指 -->
    <path d="M 162 110
             Q 162 52 176 52
             Q 190 52 190 110"/>
    <!-- 小指（最短） -->
    <path d="M 196 130
             Q 196 80 208 80
             Q 220 80 220 132
             Q 220 144 210 146"/>
  </g>

  <!-- 掌心纹路（细线） -->
  <g stroke="#4A3520" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none">
    <path d="M 100 160 Q 130 170 160 158"/>
    <path d="M 96 184 Q 130 192 158 180"/>
  </g>
</svg>
