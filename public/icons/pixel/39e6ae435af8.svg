<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- 壶盖提手 -->
  <rect x="7" y="1" width="2" height="1" fill="#FFFFFF"/>
  <rect x="6" y="2" width="4" height="1" fill="#FFFFFF"/>
  
  <!-- 壶盖 -->
  <rect x="3" y="2" width="10" height="2" fill="#2A6F9E"/>
  <rect x="4" y="4" width="8" height="1" fill="#3C8DB9"/>
  
  <!-- 壶身（从上到下逐渐变窄） -->
  <rect x="3" y="5" width="10" height="5" fill="#4ABBF5"/>
  <rect x="4" y="10" width="9" height="5" fill="#4ABBF5"/>
  <rect x="5" y="15" width="8" height="5" fill="#4ABBF5"/>
  
  <!-- 壶身轮廓 -->
  <rect x="2" y="5" width="1" height="15" fill="#2A6F9E"/>
  <rect x="13" y="5" width="1" height="10" fill="#2A6F9E"/>
  <rect x="4" y="15" width="1" height="5" fill="#2A6F9E"/>
  <rect x="12" y="15" width="1" height="5" fill="#2A6F9E"/>
  
  <!-- 壶嘴 -->
  <rect x="0" y="6" width="3" height="4" fill="#555555"/>
  <rect x="0" y="5" width="1" height="1" fill="#555555"/>
  <rect x="1" y="4" width="1" height="1" fill="#555555"/>
  
  <!-- 手柄 -->
  <rect x="13" y="6" width="3" height="8" fill="#555555"/>
  <rect x="14" y="5" width="2" height="1" fill="#555555"/>
  <rect x="15" y="7" width="1" height="1" fill="#555555"/>
  
  <!-- 壶底 -->
  <rect x="3" y="20" width="10" height="2" fill="#555555"/>
  
  <!-- 高光 -->
  <rect x="5" y="6" width="2" height="3" fill="#8FD9FF"/>
  <rect x="6" y="11" width="2" height="2" fill="#8FD9FF"/>
  
  <!-- 蒸汽孔装饰 -->
  <rect x="7" y="1" width="2" height="1" fill="#FFFFFF"/>
</svg>