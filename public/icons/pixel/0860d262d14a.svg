  <rect x="3" y="16" width="12" height="1" fill="#E08A6E"/>
  <rect x="3" y="20" width="12" height="1" fill="#E08A6E"/>
  <!-- 第5层窗户 -->
  <rect x="5" y="5" width="2" height="2" fill="#4A7FAD"/>
  <rect x="11" y="5" width="2" height="2" fill="#4A7FAD"/>
  <!-- 第4层窗户 -->
  <rect x="5" y="9" width="2" height="2" fill="#4A7FAD"/>
  <rect x="11" y="9" width="2" height="2" fill="#4A7FAD"/>
  <!-- 第3层窗户 -->
  <rect x="5" y="13" width="2" height="2" fill="#4A7FAD"/>
  <rect x="11" y="13" width="2" height="2" fill="#4A7FAD"/>
  <!-- 第2层窗户 -->
  <rect x="5" y="17" width="2" height="2" fill="#4A7FAD"/>
