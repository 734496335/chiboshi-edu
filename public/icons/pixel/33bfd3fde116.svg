<svg xmlns="http://www.w3.org/2000/svg" width="28" height="14" viewBox="0 0 28 14" shape-rendering="crispEdges">
  <!-- 车身主体轮廓 -->
  <rect x="5" y="3" width="18" height="1" fill="#CC2222"/>
  <rect x="4" y="4" width="20" height="1" fill="#CC2222"/>
  <!-- 车身上部（车顶、前后挡风玻璃框） -->
  <rect x="7" y="2" width="14" height="1" fill="#DD3333"/>
  <rect x="6" y="3" width="16" height="4" fill="#E84444"/>
  <!-- 车窗 -->
  <rect x="8" y="4" width="4" height="2" fill="#A8D8FF"/>
  <rect x="14" y="4" width="4" height="2" fill="#A8D8FF"/>
  <!-- 车门轮廓线 -->
  <rect x="12" y="3" width="1" height="4" fill="#CC2222"/>
  <!-- 车身下部（保险杠、底盘） -->
  <rect x="3" y="7" width="22" height="3" fill="#AA1E1E"/>
  <!-- 前后车灯 -->
  <rect x="4" y="5" width="2" height="1" fill="#FFD700"/>
  <rect x="22" y="5" width="2" height="1" fill="#FF3333"/>
  <!-- 车轮（左侧） -->
  <rect x="6" y="10" width="4" height="3" fill="#1F1F1F"/>
  <rect x="7" y="11" width="2" height="1" fill="#555555"/>
  <!-- 车轮（右侧） -->
  <rect x="18" y="10" width="4" height="3" fill="#1F1F1F"/>
  <rect x="19" y="11" width="2" height="1" fill="#555555"/>
  <!-- 高光细节 -->
  <rect x="9" y="3" width="2" height="1" fill="#FF8888"/>
  <rect x="16" y="3" width="2" height="1" fill="#FF8888"/>
</svg>