<svg xmlns="http://www.w3.org/2000/svg" width="28" height="16" viewBox="0 0 28 16" shape-rendering="crispEdges">
  <!-- 天空背景 -->
  <rect x="0" y="1" width="28" height="10" fill="#A8D8FF"/>
  <!-- 左边山 -->
  <rect x="8" y="7" width="2" height="2" fill="#5DC468"/>
  <rect x="6" y="9" width="6" height="2" fill="#3FAB52"/>
  <rect x="4" y="12" width="10" height="2" fill="#2D8A3E"/>
  <!-- 右边山 -->
  <rect x="20" y="6" width="2" height="2" fill="#5DC468"/>
  <rect x="18" y="8" width="6" height="2" fill="#3FAB52"/>
  <rect x="16" y="11" width="10" height="3" fill="#2D8A3E"/>
  <!-- 草地 -->
  <rect x="0" y="11" width="28" height="4" fill="#4CAF50"/>
  <!-- 房子墙壁 -->
  <rect x="12" y="8" width="6" height="4" fill="#FFFFFF"/>
  <!-- 房子屋顶 -->
  <rect x="11" y="8" width="8" height="1" fill="#C92424"/>
  <rect x="12" y="7" width="6" height="1" fill="#C92424"/>
  <rect x="13" y="6" width="4" height="1" fill="#C92424"/>
  <!-- 门 -->
  <rect x="14" y="9" width="2" height="2" fill="#6B4220"/>
  <!-- 窗户 -->
  <rect x="13" y="9" width="1" height="1" fill="#A8D8FF"/>
  <rect x="16" y="9" width="1" height="1" fill="#A8D8FF"/>
  <!-- 左边云 -->
  <rect x="5" y="4" width="5" height="1" fill="#FFFFFF"/>
  <rect x="4" y="3" width="2" height="1" fill="#FFFFFF"/>
  <rect x="7" y="3" width="2" height="1" fill="#FFFFFF"/>
  <!-- 右边云 -->
  <rect x="18" y="3" width="4" height="1" fill="#FFFFFF"/>
  <rect x="17" y="2" width="2" height="1" fill="#FFFFFF"/>
  <rect x="20" y="2" width="1" height="1" fill="#FFFFFF"/>
  <!-- 太阳 -->
  <rect x="2" y="2" width="3" height="1" fill="#FFD700"/>
  <rect x="1" y="3" width="5" height="3" fill="#FFD700"/>
  <rect x="2" y="6" width="3" height="1" fill="#FFD700"/>
</svg>