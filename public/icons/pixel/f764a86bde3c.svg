  <rect x="2" y="11" width="1" height="2" fill="#8B6914"/>
  <rect x="13" y="11" width="1" height="2" fill="#8B6914"/>
  <rect x="3" y="13" width="2" height="1" fill="#8B6914"/>
  <rect x="11" y="13" width="2" height="1" fill="#8B6914"/>
